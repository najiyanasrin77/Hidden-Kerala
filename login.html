<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <form class="loginbox" id="loginform">
        <h1>Log-In</h1>

        <input type="text" placeholder="Enter username" id="name" required>
        
        <br><br>

        <input type="password" placeholder="Password" id="pass" required>
    
        <br><br>
        <p id="error" class="error"></p>
        <button type="submit" id="login"> Log-In</button>
        
        <p class="optionlogin">don't have an account? <a href="signup.html" class="optionsignin" style="color: rgb(102, 10, 10);  text-decoration: underline;">Sign-In</a></p>

    </form>
    <script src="login.js"></script>
</body>
</html>
